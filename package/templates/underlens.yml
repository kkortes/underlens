name: Underlens

# The triggers decide when PRs are reviewed: schedule reviews every open PR not
# reviewed yet, at the cron's hour in UTC. Add opened and reopened to
# pull_request to review each PR as it opens. Keep edited and closed: they act
# on Agree and Disagree, and clean up after a closed PR.
on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    types: [edited, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR to review now. Leave empty to check every harness signs in.

permissions:
  contents: write
  pull-requests: write

jobs:
  underlens:
    uses: kkortes/underlens/.github/workflows/run.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
