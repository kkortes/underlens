name: Underlens

# Called from a repo's own .github/workflows/underlens.yml, which keeps the
# triggers, the token's permissions and the harness secrets: a called workflow
# can't widen the caller's token, and a repo outside this one's owner can't
# hand its secrets over with `inherit`.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
      CODEX_AUTH_JSON:
      GLM_API_KEY:
      GEMINI_API_KEY:
      XAI_API_KEY:

jobs:
  underlens:
    runs-on: ubuntu-latest
    concurrency:
      group: underlens-${{ github.event.pull_request.number || github.event.inputs.pr || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bunx @ape-egg/underlens@1
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
