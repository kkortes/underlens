name: Underlens

# Called from a repo's own .github/workflows/underlens.yml, which keeps the
# triggers, the token's permissions and the harness secrets: a called workflow
# can't widen the caller's token, and a repo outside this one's owner can't
# hand its secrets over with `inherit`.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label the review runs on
        type: string
        default: ubuntu-26.04
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
      CODEX_AUTH_JSON:
      GLM_API_KEY:
      GEMINI_API_KEY:
      XAI_API_KEY:

jobs:
  underlens:
    runs-on: ${{ inputs.runs-on }}
    concurrency:
      group: underlens-${{ github.event.pull_request.head.ref || github.event.inputs.branch || github.run_id }}
    steps:
      # The default branch on every event, so the config and rules can't come
      # from the branch a run was dispatched on or the PR it reviews.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
      - run: bunx @ape-egg/underlens@1
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
